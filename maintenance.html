<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adarsh B A | System Maintenance</title>
    <link rel="icon" type="image/png" href="logo.png">
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Feather Icons -->
    <script defer src="https://unpkg.com/feather-icons"></script>
    <style>
        :root {
            --bg-base: #070709;
            --accent-indigo: #818cf8;
            --accent-emerald: #34d399;
            --accent-cyan: #22d3ee;
            --text-main: #f1f5f9;
            --text-secondary: #cbd5e1;
            --text-muted: #94a3b8;
            --glass-bg: rgba(13, 13, 22, 0.65);
            --glass-border: rgba(255, 255, 255, 0.09);
        }
        
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg-base);
            color: var(--text-main);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            overflow: hidden;
        }

        /* Ambient Background Glow */
        .ambient-glow {
            position: absolute;
            top: 50%; left: 50%;
            width: 80vw; height: 80vh;
            transform: translate(-50%, -50%);
            background: radial-gradient(circle, rgba(129, 140, 248, 0.05) 0%, rgba(34, 211, 153, 0.02) 40%, transparent 70%);
            z-index: -2;
            filter: blur(60px);
            animation: pulse-glow 8s infinite alternate ease-in-out;
        }

        @keyframes pulse-glow {
            0% { opacity: 0.5; transform: translate(-50%, -50%) scale(1); }
            100% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
        }

        .noise-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: url('data:image/svg+xml,%3Csvg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"%3E%3Cfilter id="noiseFilter"%3E%3CfeTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="3" stitchTiles="stitch"/%3E%3C/filter%3E%3Crect width="100%25" height="100%25" filter="url(%23noiseFilter)"/%3E%3C/svg%3E');
            opacity: 0.04;
            z-index: -1;
            pointer-events: none;
        }

        .maintenance-card {
            background: var(--glass-bg);
            backdrop-filter: blur(24px);
            -webkit-backdrop-filter: blur(24px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 3rem;
            max-width: 600px;
            width: 90%;
            box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6);
            position: relative;
            z-index: 10;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(245, 158, 11, 0.1);
            border: 1px solid rgba(245, 158, 11, 0.2);
            color: #f59e0b;
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            margin-bottom: 2rem;
        }

        .pulse-dot {
            width: 8px; height: 8px;
            background-color: #f59e0b;
            border-radius: 50%;
            animation: pulse-orange 2s infinite;
        }

        @keyframes pulse-orange {
            0% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0.7); }
            70% { box-shadow: 0 0 0 8px rgba(245, 158, 11, 0); }
            100% { box-shadow: 0 0 0 0 rgba(245, 158, 11, 0); }
        }

        h1 {
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-bottom: 1rem;
            background: linear-gradient(90deg, #f1f5f9 0%, var(--accent-indigo) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p.desc {
            color: var(--text-secondary);
            font-size: 1.05rem;
            line-height: 1.6;
            margin-bottom: 2rem;
        }

        /* Hacker Terminal Component */
        .terminal-box {
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 12px;
            padding: 1.5rem;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            line-height: 1.5;
            color: var(--accent-cyan);
            height: 180px;
            overflow-y: hidden;
            display: flex;
            flex-direction: column;
            justify-content: flex-end;
            position: relative;
        }

        .terminal-box::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0;
            height: 30px;
            background: linear-gradient(to bottom, rgba(0,0,0,0.9), transparent);
            z-index: 1;
        }

        .terminal-line { margin-bottom: 6px; }
        .t-user { color: var(--accent-emerald); font-weight: 500; }
        .t-path { color: var(--accent-indigo); }
        .t-dim { color: var(--text-muted); }
        .t-warn { color: #f59e0b; }
        
        .cursor {
            display: inline-block;
            width: 8px; height: 15px;
            background: var(--accent-cyan);
            vertical-align: middle;
            animation: blink 1s step-end infinite;
        }

        @keyframes blink { 50% { opacity: 0; } }

        /* Progress Bar */
        .progress-wrapper {
            margin-top: 2rem;
            margin-bottom: 2rem;
        }
        .progress-header {
            display: flex;
            justify-content: space-between;
            font-size: 0.8rem;
            color: var(--text-muted);
            margin-bottom: 8px;
            font-family: 'Fira Code', monospace;
        }
        .progress-track {
            width: 100%;
            height: 6px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, var(--accent-indigo), var(--accent-emerald));
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(52, 211, 153, 0.5);
            transition: width 1s ease-out;
        }

        .btn-group {
            display: flex;
            gap: 15px;
            margin-top: 1rem;
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            padding: 12px 24px;
            border-radius: 12px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.3s ease;
            cursor: pointer;
            border: 1px solid transparent;
        }

        .btn-primary {
            background: rgba(129, 140, 248, 0.15);
            color: var(--accent-indigo);
            border-color: rgba(129, 140, 248, 0.3);
        }

        .btn-primary:hover {
            background: rgba(129, 140, 248, 0.25);
            transform: translateY(-2px);
        }

        @media (max-width: 600px) {
            .maintenance-card { padding: 2rem; }
            h1 { font-size: 1.8rem; }
            .btn-group { flex-direction: column; }
        }
    </style>
</head>
<body>

    <div class="ambient-glow"></div>
    <div class="noise-overlay"></div>

    <div class="maintenance-card">
        <div class="status-badge">
            <span class="pulse-dot"></span> System Maintenance
        </div>
        
        <h1>Architecture Upgrade in Progress</h1>
        <p class="desc">The portfolio infrastructure is currently undergoing scheduled maintenance to deploy new features and optimize performance. Normal operations will resume shortly.</p>

        <div class="terminal-box" id="terminal">
            <div id="terminal-content" style="z-index: 2;"></div>
            <div><span class="t-user">root@adhi.is-a.dev</span>:<span class="t-path">~</span>$ <span id="typing-text"></span><span class="cursor"></span></div>
        </div>

        <div class="progress-wrapper">
            <div class="progress-header">
                <span>Deployment Pipeline</span>
                <span id="progress-text">64%</span>
            </div>
            <div class="progress-track">
                <div class="progress-fill" id="progress-bar" style="width: 64%;"></div>
            </div>
        </div>

        <div class="btn-group">
            <a href="mailto:contact@adhi.is-a.dev" class="btn btn-primary">
                <i data-feather="mail" style="width: 18px; height: 18px;"></i> Urgent Inquiry
            </a>
            <a href="https://linkedin.com/in/developeradhi" target="_blank" class="btn btn-primary" style="background: rgba(255,255,255,0.05); color: #fff; border-color: rgba(255,255,255,0.1);">
                <i data-feather="linkedin" style="width: 18px; height: 18px;"></i> Connect on LinkedIn
            </a>
        </div>
    </div>

    <script>
        feather.replace();

        // Terminal Animation Logic
        const terminalContent = document.getElementById('terminal-content');
        const typingText = document.getElementById('typing-text');
        const progressBar = document.getElementById('progress-bar');
        const progressText = document.getElementById('progress-text');
        
        const bootSequence = [
            "<span class='t-dim'>[OK] Terminating edge node connections...</span>",
            "<span class='t-dim'>[OK] Flushing Redis cache...</span>",
            "<span class='t-dim'>[OK] Creating isolated deployment branch...</span>",
            "<span class='t-warn'>[WARN] Optimizing PostGIS vectors (takes ~2m)</span>",
            "<span class='t-dim'>[OK] Recompiling React Three Fiber components...</span>",
            "<span class='t-dim'>[OK] Syncing Supabase edge functions...</span>"
        ];

        const commands = [
            "docker-compose down",
            "git pull origin main",
            "npm run build",
            "supabase db push",
            "pm2 restart all"
        ];

        let seqIndex = 0;
        let progress = 64;

        // Populate initial logs
        for(let i=0; i<3; i++) {
            terminalContent.innerHTML += `<div class="terminal-line">${bootSequence[i]}</div>`;
            seqIndex++;
        }

        function typeCommand(cmd, callback) {
            let i = 0;
            typingText.innerHTML = '';
            const interval = setInterval(() => {
                typingText.innerHTML += cmd.charAt(i);
                i++;
                if (i >= cmd.length) {
                    clearInterval(interval);
                    setTimeout(callback, 800);
                }
            }, 50 + Math.random() * 50);
        }

        function runTerminal() {
            if (seqIndex < bootSequence.length) {
                // Add a log
                terminalContent.innerHTML += `<div class="terminal-line">${bootSequence[seqIndex]}</div>`;
                seqIndex++;
                
                // Increase progress slightly
                progress += Math.random() * 5;
                if(progress > 99) progress = 99;
                progressBar.style.width = `${progress.toFixed(1)}%`;
                progressText.innerText = `${progress.toFixed(1)}%`;

                setTimeout(runTerminal, 1500 + Math.random() * 2000);
            } else {
                // Type a fake command
                typeCommand(commands[Math.floor(Math.random() * commands.length)], () => {
                    terminalContent.innerHTML += `<div class="terminal-line"><span class="t-user">root@adhi.is-a.dev</span>:<span class="t-path">~</span>$ ${typingText.innerHTML}</div>`;
                    terminalContent.innerHTML += `<div class="terminal-line"><span class="t-dim">Executing...</span></div>`;
                    typingText.innerHTML = '';
                    setTimeout(runTerminal, 2000);
                });
            }
        }

        setTimeout(runTerminal, 2000);
    </script>
</body>
</html>
