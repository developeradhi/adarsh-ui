<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Adarsh B A | Scheduled Maintenance</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/feather-icons"></script>
    
    <style>
        :root {
            --bg: #050505;
            --text-main: #ffffff;
            --text-muted: #888888;
            --accent: #ffffff;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }

        /* Vercel-like glowing mesh background */
        .mesh-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 150vw;
            height: 150vh;
            background: 
                radial-gradient(circle at 50% 50%, rgba(255,255,255,0.03) 0%, transparent 50%),
                radial-gradient(circle at 80% 20%, rgba(129, 140, 248, 0.05) 0%, transparent 40%),
                radial-gradient(circle at 20% 80%, rgba(52, 211, 153, 0.05) 0%, transparent 40%);
            z-index: -1;
            animation: breathe 10s ease-in-out infinite alternate;
        }

        @keyframes breathe {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1.1); }
        }

        .container {
            max-width: 600px;
            width: 90%;
            text-align: center;
            z-index: 10;
        }

        .icon-wrapper {
            width: 64px;
            height: 64px;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 20px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 2rem auto;
            backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-10px); }
        }

        .icon-wrapper svg {
            color: #fff;
            width: 32px;
            height: 32px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 700;
            letter-spacing: -0.03em;
            margin-bottom: 1rem;
            background: linear-gradient(180deg, #FFFFFF 0%, #AAAAAA 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        p {
            font-size: 1.1rem;
            color: var(--text-muted);
            line-height: 1.6;
            margin-bottom: 3rem;
            font-weight: 400;
        }

        .contact-card {
            background: rgba(255,255,255,0.02);
            border: 1px solid rgba(255,255,255,0.05);
            border-radius: 16px;
            padding: 1.5rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(10px);
            transition: all 0.3s ease;
        }

        .contact-card:hover {
            background: rgba(255,255,255,0.05);
            border-color: rgba(255,255,255,0.1);
            transform: translateY(-2px);
        }

        .contact-info {
            display: flex;
            align-items: center;
            gap: 12px;
            text-align: left;
        }

        .avatar {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            background: #222;
        }

        .contact-details h3 {
            font-size: 1rem;
            font-weight: 600;
            color: #fff;
            margin-bottom: 2px;
        }

        .contact-details span {
            font-size: 0.85rem;
            color: var(--text-muted);
        }

        .btn {
            background: #fff;
            color: #000;
            padding: 10px 20px;
            border-radius: 30px;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 600;
            transition: opacity 0.2s ease;
        }

        .btn:hover {
            opacity: 0.8;
        }

        /* Subtle grid lines */
        .grid-bg {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background-image: 
                linear-gradient(to right, rgba(255,255,255,0.02) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(255,255,255,0.02) 1px, transparent 1px);
            background-size: 50px 50px;
            z-index: -2;
            mask-image: radial-gradient(circle at center, black, transparent 80%);
            -webkit-mask-image: radial-gradient(circle at center, black, transparent 80%);
        }
    </style>
</head>
<body>
    <div class="grid-bg"></div>
    <div class="mesh-bg"></div>

    <div class="container">
        <div class="icon-wrapper">
            <i data-feather="loader" class="spin"></i>
        </div>
        
        <h1>Upgrading Infrastructure</h1>
        <p>The portfolio is currently undergoing a scheduled architectural upgrade. I am deploying new features and optimizing performance. Normal operations will resume shortly.</p>

        <div class="contact-card">
            <div class="contact-info">
                <img src="https://avatars.githubusercontent.com/u/154442004?v=4" alt="Adarsh B A" class="avatar">
                <div class="contact-details">
                    <h3>Adarsh B A</h3>
                    <span>Full-Stack Engineer</span>
                </div>
            </div>
            <a href="mailto:contact@adhi.is-a.dev" class="btn">Get in touch</a>
        </div>
    </div>

    <script>
        feather.replace();
        
        // Simple continuous rotation for the loader icon
        const loader = document.querySelector('.icon-wrapper svg');
        let rotation = 0;
        setInterval(() => {
            rotation += 2;
            loader.style.transform = `rotate(${rotation}deg)`;
        }, 20);

        // Auto-poll Supabase to check if maintenance is over, so it redirects back automatically!
        setInterval(async () => {
            try {
                const res = await fetch('https://mznzvxwzugimqzhhdnae.supabase.co/rest/v1/site_settings?select=is_maintenance_mode', {
                    headers: { 'apikey': 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im16bnp2eHd6dWdpbXF6aGhkbmFlIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODU5ODkzNjksImV4cCI6MjEwMTU2NTM2OX0.AL0sY92IZeP_vSyqYRoKoKkE3oMPvNYukNU3uNbJhWs' }
                });
                const data = await res.json();
                if (data && data.length > 0 && data[0].is_maintenance_mode === false) {
                    window.location.replace('index.html');
                }
            } catch (e) {}
        }, 5000);
    </script>
</body>
</html>
