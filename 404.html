<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 - Page Not Found | Adarsh B A</title>
    <!-- Links to your specific fonts and stylesheet -->
    <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .error-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            text-align: center;
            padding: 20px;
            z-index: 10;
            position: relative;
        }
        .error-code {
            font-size: 8rem;
            font-weight: 800;
            background: linear-gradient(90deg, #60A5FA, #A78BFA);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 10px;
            font-family: 'Fira Code', monospace;
        }
        .error-msg {
            font-size: 1.5rem;
            color: #94a3b8; /* fallback color */
            margin-bottom: 30px;
        }
    </style>
</head>
<body style="background-color: #070709; color: white;">
    <!-- Your premium background effects -->
    <div class="noise-overlay"></div>
    <div class="background-radial"></div>

        <h1 class="error-code">404</h1>

        <!-- Return Home Button -->
